<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CMS | Vijay Saharan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .admin-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="min-h-screen">

    <div id="authShield" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[40px] w-full max-w-md text-center">
            <h2 class="text-2xl font-black mb-8">System Login</h2>
            <input type="password" id="pinInput" placeholder="PIN" maxlength="4" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-center mb-4 text-xl tracking-[1em] outline-none">
            <button onclick="verify()" class="w-full admin-gradient py-4 rounded-2xl font-bold uppercase">Enter CMS</button>
        </div>
    </div>

    <div id="panel" class="hidden">
        <nav class="glass p-6 flex justify-between items-center sticky top-0 z-50">
            <h1 class="font-black tracking-tighter text-xl">VIJAY <span class="text-indigo-500">CMS</span></h1>
            <div class="flex gap-4">
                <button onclick="exportJSON()" class="bg-emerald-600 px-6 py-2 rounded-xl font-bold text-xs">EXPORT MASTER JSON</button>
                <button onclick="location.reload()" class="bg-red-600 px-6 py-2 rounded-xl font-bold text-xs">LOGOUT</button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-6 md:p-12">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black">Live Course List</h2>
                <button onclick="openModal()" class="admin-gradient px-6 py-3 rounded-xl font-bold text-xs">+ ADD COURSE</button>
            </div>

            <div id="courseList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/90 hidden z-[60] flex items-center justify-center p-6">
        <div class="glass p-8 rounded-[40px] w-full max-w-lg">
            <h3 id="modalTitle" class="text-xl font-bold mb-6">Course Details</h3>
            <div class="space-y-4">
                <input type="text" id="cTitle" placeholder="Course Title" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="text" id="cPrice" placeholder="Price (e.g. ₹499)" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="text" id="cLink" placeholder="Link to Chapters" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="text" id="cIcon" placeholder="FontAwesome Icon (e.g. fas fa-code)" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <div class="flex gap-4 mt-6">
                    <button onclick="closeModal()" class="flex-1 py-4 border border-white/10 rounded-xl">Cancel</button>
                    <button onclick="saveCourse()" class="flex-1 admin-gradient py-4 rounded-xl font-bold">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let courses = JSON.parse(localStorage.getItem('vijay_data')) || [];
        let editingId = null;

        function verify() {
            if(document.getElementById('pinInput').value === "1234") {
                document.getElementById('authShield').style.display = 'none';
                document.getElementById('panel').classList.remove('hidden');
                render();
            }
        }

        function render() {
            const list = document.getElementById('courseList');
            list.innerHTML = courses.map(c => `
                <div class="glass p-6 rounded-3xl flex justify-between items-center">
                    <div>
                        <h4 class="font-bold">${c.title}</h4>
                        <p class="text-emerald-500 text-sm font-bold">${c.price}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="edit(${c.id})" class="p-3 bg-white/5 rounded-xl hover:bg-indigo-600"><i class="fas fa-edit"></i></button>
                        <button onclick="del(${c.id})" class="p-3 bg-white/5 rounded-xl hover:bg-red-600"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function openModal() {
            editingId = null;
            document.getElementById('cTitle').value = "";
            document.getElementById('cPrice').value = "";
            document.getElementById('cLink').value = "";
            document.getElementById('cIcon').value = "fas fa-graduation-cap";
            document.getElementById('modal').classList.remove('hidden');
        }

        function edit(id) {
            editingId = id;
            const c = courses.find(x => x.id === id);
            document.getElementById('cTitle').value = c.title;
            document.getElementById('cPrice').value = c.price;
            document.getElementById('cLink').value = c.link;
            document.getElementById('cIcon').value = c.icon;
            document.getElementById('modal').classList.remove('hidden');
        }

        function saveCourse() {
            const data = {
                id: editingId || Date.now(),
                title: document.getElementById('cTitle').value,
                price: document.getElementById('cPrice').value,
                link: document.getElementById('cLink').value,
                icon: document.getElementById('cIcon').value
            };
            if(editingId) {
                courses = courses.map(x => x.id === editingId ? data : x);
            } else {
                courses.push(data);
            }
            localStorage.setItem('vijay_data', JSON.stringify(courses));
            closeModal();
            render();
        }

        function del(id) {
            if(confirm("Remove this course?")) {
                courses = courses.filter(x => x.id !== id);
                localStorage.setItem('vijay_data', JSON.stringify(courses));
                render();
            }
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(courses, null, 4)], {type : 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'courses.json';
            a.click();
            alert("Upload this file to GitHub now!");
        }
    </script>
</body>
</html>
