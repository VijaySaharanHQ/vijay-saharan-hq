        function verify() {
            if(document.getElementById('pinInput').value === "1234") {

                document.getElementById('panel').classList.remove('hidden');
                render();
            }
        }

        function render() {
            const list = document.getElementById('courseList');
            list.innerHTML = courses.map(c => `
                <div class="glass p-6 rounded-3xl course-card transition-all">
                    <div class="flex items-center gap-4">
                        <div class="p-4 bg-indigo-500/10 text-indigo-500 rounded-2xl"><i class="${c.icon}"></i></div>
                        <div>
                            <h4 class="font-bold text-sm leading-tight">${c.title}</h4>
                            <p class="text-emerald-500 font-bold text-xs mt-1">${c.price}</p>
                            <p class="text-[8px] text-slate-500 uppercase tracking-widest mt-1">${c.cat}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCat(cat) {
            if(cat === 'All') courses = megaList;
            else courses = megaList.filter(c => c.cat === cat);
            render();
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(megaList, null, 4)], {type : 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'courses.json';
            a.click();
            alert("MASTER FILE GENERATED: Upload 'courses.json' to GitHub to activate all 150 courses.");
        }
