<script>
    var player;
    var isReady = false;

    // 1. Load YouTube API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 2. This function runs when API is ready
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            events: {
                'onReady': onPlayerReady,
                'onError': onPlayerError
            }
        });
    }

    function onPlayerReady(event) {
        isReady = true;
        console.log("System Ready: Audio Interface Online");
    }

    function onPlayerError(e) {
        console.error("Audio Error:", e);
        alert("Could not load stream. Check your internet connection.");
    }

    function controlMusic(action) {
        if (!isReady) {
            alert("System still booting... Wait 2 seconds.");
            return;
        }

        const bars = document.querySelectorAll('.bar');
        
        if (action === 'play') {
            player.playVideo();
            // Start Visualizer Animation
            bars.forEach(bar => {
                bar.style.animationPlayState = 'running';
                bar.style.animationDuration = '0.6s';
            });
        } else {
            player.pauseVideo();
            // Pause Visualizer Animation
            bars.forEach(bar => {
                bar.style.animationPlayState = 'paused';
            });
        }
    }
</script>
