<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Saharan | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .nav-link:hover { color: #7c3aed; }
        .course-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; transition: 0.3s; }
        .course-card:hover { transform: translateY(-5px); border-color: #7c3aed; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="bg-white border-b sticky top-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-purple-600 tracking-tighter">VIJAY SAHARAN</a>
            <div class="hidden md:flex gap-8 font-bold text-gray-600 text-sm">
                <a href="index.html" class="text-purple-600">Home</a>
                <a href="about.html" class="nav-link">About Me</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="policy.html" class="nav-link">Policies</a>
            </div>
        </div>
    </nav>

    <header class="py-20 text-center px-4 bg-white border-b">
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6">Master <span class="text-purple-600">Tech</span> Skills.</h1>
        <p class="text-gray-500 text-xl max-w-2xl mx-auto font-medium">Your all-in-one hub for coding, gaming, and education. Access 100+ premium resources today.</p>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-10 flex flex-col md:flex-row gap-4">
        <input type="text" id="searchInput" onkeyup="renderHub()" placeholder="Search courses (Python, Physics...)" class="flex-grow p-4 rounded-xl border-2 border-gray-100 focus:border-purple-600 outline-none shadow-sm">
        <select id="categoryFilter" onchange="renderHub()" class="p-4 rounded-xl border-2 border-gray-100 font-bold text-gray-500">
            <option value="All">All Categories</option>
            <option value="Development">Coding</option>
            <option value="Education">Education</option>
            <option value="Platforms">Platforms</option>
        </select>
    </div>

    <div id="platform-grid" class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-24">
        </div>

    <script>
        const myWhatsApp = "919876543210"; 
        let database = [];
        async function init() {
            const res = await fetch('courses.json?v=' + new Date().getTime());
            database = await res.json();
            renderHub();
        }
        function renderHub() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const container = document.getElementById('platform-grid');
            container.innerHTML = "";
            database.filter(item => (item.name.toLowerCase().includes(query)) && (category === "All" || item.cat === category))
            .forEach(s => {
                container.innerHTML += `
                <div class="course-card p-6 flex flex-col h-full">
                    <div class="h-40 bg-slate-50 rounded-xl mb-6 flex items-center justify-center text-slate-300 text-5xl">
                        <i class="fas ${s.icon}"></i>
                    </div>
                    <span class="text-[10px] font-black text-purple-600 uppercase tracking-widest mb-2">${s.cat}</span>
                    <h3 class="text-xl font-bold mb-6 text-gray-800">${s.name}</h3>
                    <div class="mt-auto">
                        <a href="${s.isPaid ? 'https://wa.me/'+myWhatsApp+'?text=I want to buy '+s.name : s.url}" class="block w-full py-4 ${s.isPaid ? 'bg-purple-600 shadow-lg shadow-purple-100' : 'bg-gray-800'} text-white text-center rounded-xl font-bold hover:opacity-90">
                            ${s.isPaid ? 'Enroll Now ('+s.price+')' : 'Start Free Learning'}
                        </a>
                    </div>
                </div>`;
            });
        }
        init();
    </script>
</body>
</html>
