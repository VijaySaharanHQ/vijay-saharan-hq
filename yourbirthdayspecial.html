<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You | Vijay Saharan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        body { background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        .pink-gradient { background: linear-gradient(45deg, #ff0055, #7000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .heart { position: absolute; color: #ff0055; animation: fall linear infinite; pointer-events: none; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        .typewriter { overflow: hidden; border-right: .15em solid #ff0055; white-space: nowrap; margin: 0 auto; letter-spacing: .15em; animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #ff0055; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

    <div id="lockScreen" class="text-center z-50">
        <div class="mb-8 animate-pulse text-6xl">❤️</div>
        <h2 class="text-sm uppercase tracking-[0.5em] mb-6 opacity-60">Security Encrypted for Her Only</h2>
        <button onclick="unlockLove()" class="px-12 py-5 rounded-full border border-white/20 hover:bg-white hover:text-black transition-all duration-500 font-bold tracking-widest uppercase text-xs">
            Unlock My Heart
        </button>
    </div>

    <div id="mainStage" class="hidden text-center z-10 w-full max-w-2xl px-6">
        <div class="glass-card p-12 rounded-[50px] relative overflow-hidden">
            <h1 class="text-6xl md:text-8xl font-bold pink-gradient mb-4">Happy</h1>
            <h1 class="text-6xl md:text-8xl font-bold pink-gradient mb-8">Birthday!</h1>
            
            <div class="wish-font text-4xl text-white mb-10 leading-relaxed italic" style="font-family: 'Dancing Script', cursive;">
                "I love you more than words can express..."
            </div>

            <div class="space-y-4 text-gray-400 text-sm font-medium tracking-wide mb-8">
                <p class="typewriter">To the girl who makes my world perfect.</p>
                <p>I didn't just build a website... I built a galaxy for you.</p>
            </div>

            <div class="pt-6 border-t border-white/10 flex justify-center gap-8">
                <div class="text-center">
                    <span class="block text-2xl font-bold">Forever</span>
                    <span class="text-[10px] uppercase tracking-widest text-purple-400">Duration</span>
                </div>
                <div class="text-center">
                    <span class="block text-2xl font-bold text-pink-500">∞</span>
                    <span class="text-[10px] uppercase tracking-widest text-purple-400">Love Limit</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function unlockLove() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainStage').classList.remove('hidden');
            
            // 1. Start Heart Rain
            setInterval(createHeart, 300);
            
            // 2. Explode Premium Confetti
            var end = Date.now() + (15 * 1000);
            var colors = ['#ff0055', '#ffffff', '#7000ff'];

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
