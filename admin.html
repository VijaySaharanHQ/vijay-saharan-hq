<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Vijay Saharan HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .admin-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="min-h-screen">

    <div id="adminAuth" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-md text-center">
            <div class="w-20 h-20 admin-gradient rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-500/20">
                <i class="fas fa-user-shield text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black mb-2">Admin Access</h2>
            <p class="text-slate-400 text-sm mb-8">System: Vijay Saharan HQ v2.0</p>
            <input type="password" id="adminPin" placeholder="Enter PIN" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-center mb-4 outline-none focus:border-indigo-500">
            <button onclick="verifyAdmin()" class="w-full admin-gradient py-3 rounded-xl font-bold hover:opacity-90 transition-all">UNLOOCK PANEL</button>
        </div>
    </div>

    <div id="adminPanel" class="hidden">
        <nav class="border-b border-white/10 p-6 flex justify-between items-center glass sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-xs font-black">VS</div>
                <h1 class="font-bold tracking-tighter">ADMIN <span class="text-indigo-400">DASHBOARD</span></h1>
            </div>
            <button onclick="location.reload()" class="text-xs bg-red-500/10 text-red-400 px-4 py-2 rounded-lg border border-red-500/20 hover:bg-red-500 hover:text-white transition-all">LOGOUT</button>
        </nav>

        <main class="max-w-7xl mx-auto p-6 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="glass p-6 rounded-2xl border-l-4 border-indigo-500">
                    <p class="text-slate-500 text-xs font-bold uppercase mb-1">Total Courses</p>
                    <h3 class="text-3xl font-black">100+</h3>
                </div>
                <div class="glass p-6 rounded-2xl border-l-4 border-emerald-500">
                    <p class="text-slate-500 text-xs font-bold uppercase mb-1">Active Streams</p>
                    <h3 class="text-3xl font-black">12+</h3>
                </div>
                <div class="glass p-6 rounded-2xl border-l-4 border-amber-500">
                    <p class="text-slate-500 text-xs font-bold uppercase mb-1">Live Status</p>
                    <h3 class="text-3xl font-black text-emerald-400">ONLINE</h3>
                </div>
                <div class="glass p-6 rounded-2xl border-l-4 border-purple-500">
                    <p class="text-slate-500 text-xs font-bold uppercase mb-1">Brand Health</p>
                    <h3 class="text-3xl font-black">OPTIMAL</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-2 glass rounded-3xl p-8">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-xl font-bold">Course Management</h3>
                        <button class="bg-indigo-600 text-xs px-4 py-2 rounded-full font-bold">+ NEW COURSE</button>
                    </div>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-4 bg-white/5 rounded-xl border border-white/5 hover:border-indigo-500/50 transition-all cursor-pointer">
                            <div class="flex items-center gap-4">
                                <div class="p-3 bg-indigo-500/20 text-indigo-400 rounded-lg"><i class="fab fa-html5 text-xl"></i></div>
                                <div>
                                    <p class="font-bold">HTML Mastery (22 Chapters)</p>
                                    <p class="text-[10px] text-slate-500">Status: Published on WordPress</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-slate-600"></i>
                        </div>
                        </div>
                </div>

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-xl font-bold mb-8">Quick Access</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <a href="vault.html" class="p-4 bg-white/5 rounded-2xl text-center hover:bg-indigo-600 transition-all group">
                            <i class="fas fa-vault text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                            <p class="text-[10px] font-bold uppercase">Vault</p>
                        </a>
                        <a href="vision.html" class="p-4 bg-white/5 rounded-2xl text-center hover:bg-purple-600 transition-all group">
                            <i class="fas fa-eye text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                            <p class="text-[10px] font-bold uppercase">Vision</p>
                        </a>
                        <a href="vibes.html" class="p-4 bg-white/5 rounded-2xl text-center hover:bg-pink-600 transition-all group">
                            <i class="fas fa-music text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                            <p class="text-[10px] font-bold uppercase">Vibes</p>
                        </a>
                        <a href="journey.html" class="p-4 bg-white/5 rounded-2xl text-center hover:bg-blue-600 transition-all group">
                            <i class="fas fa-map text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                            <p class="text-[10px] font-bold uppercase">Journey</p>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const ADMIN_PIN = "1234"; // Same PIN as your Vault for consistency

        function verifyAdmin() {
            const pin = document.getElementById('adminPin').value;
            if(pin === ADMIN_PIN) {
                document.getElementById('adminAuth').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert("ACCESS DENIED: Unauthorized Identity");
                window.location.href = "index.html";
            }
        }

        // Enter key support
        document.getElementById("adminPin").addEventListener("keyup", (e) => {
            if (e.key === "Enter") verifyAdmin();
        });
    </script>
</body>
</html>
