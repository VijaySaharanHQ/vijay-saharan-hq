<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Saharan | Official HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <header class="py-20 text-center">
        <h1 class="text-6xl font-black tracking-tighter mb-4">Vijay <span class="text-indigo-500">Saharan</span></h1>
        <p class="text-slate-500 uppercase tracking-widest text-sm">Tech & Education Brand</p>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div id="courseContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="col-span-full text-center opacity-50 animate-pulse">Syncing System Data...</p>
        </div>
    </main>

    <script>
        async function loadCourses() {
            const container = document.getElementById('courseContainer');
            try {
                // Fetch the clean JSON exported from Admin
                const response = await fetch('courses.json');
                const data = await response.json();
                
                // WIPE ALL OLD/ODD DATA
                container.innerHTML = ""; 

                data.forEach(course => {
                    container.innerHTML += `
                        <div class="glass p-8 rounded-[40px] border border-white/5 hover:border-indigo-500 transition-all group">
                            <i class="${course.icon} text-4xl text-indigo-500 mb-6 transition-transform group-hover:scale-110"></i>
                            <h3 class="text-2xl font-bold mb-2">${course.title}</h3>
                            <p class="text-emerald-400 font-bold text-lg mb-6">${course.price}</p>
                            <a href="${course.link}" class="block text-center bg-indigo-600 py-4 rounded-2xl font-bold hover:bg-indigo-500 transition-all">Explore Chapters</a>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = "<p class='col-span-full text-center text-red-500'>Error Syncing: Run Admin Export.</p>";
            }
        }
        window.onload = loadCourses;
    </script>
</body>
</html>
