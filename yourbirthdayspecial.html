<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! | Vijay Saharan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        body { background: #050505; color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .wish-text { font-family: 'Dancing Script', cursive; }
        .gradient-text {
            background: linear-gradient(to right, #ff3366, #ff80ab, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="setup" class="text-center z-20">
        <div class="text-6xl mb-6 floating">🎁</div>
        <button onclick="revealBirthday()" class="px-10 py-4 rounded-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-black tracking-widest uppercase text-sm hover:scale-110 transition-transform shadow-lg shadow-pink-500/20">
            Open Your Birthday Surprise
        </button>
    </div>

    <div id="mainWish" class="hidden text-center z-10 w-full max-w-xl px-6">
        <div class="glass-container p-10 md:p-16 rounded-[40px] relative">
            
            <h2 class="text-xs font-bold tracking-[0.4em] text-pink-500 mb-6 uppercase">Special Delivery for You</h2>
            
            <h1 class="text-6xl md:text-8xl font-black gradient-text mb-2">Happy</h1>
            <h1 class="text-6xl md:text-8xl font-black gradient-text mb-10">Birthday</h1>

            <p class="wish-text text-4xl text-white mb-8">
                "May your day be as beautiful and amazing as you are!"
            </p>

            <div class="bg-white/5 p-6 rounded-2xl border border-white/10 italic text-gray-400 text-sm">
                "I wanted to build something unique to celebrate you. I hope this small piece of code brings a big smile to your face today."
            </div>

            <div class="mt-10 text-4xl">🎂 ✨ 🎈</div>
        </div>
    </div>

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-pink-600/10 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/10 blur-[120px] rounded-full"></div>

    <script>
        function revealBirthday() {
            // Hide intro, show wish
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('mainWish').classList.remove('hidden');

            // Fire Premium Confetti Cannon
            var duration = 10 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Fire from two sides
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);
        }
    </script>
</body>
</html>
