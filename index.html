<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Saharan HQ | Digital Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }
        .card-glow {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .card-glow:hover {
            border-color: #3b82f6;
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="max-w-4xl mx-auto text-center mb-16">
        <h1 class="text-5xl md:text-6xl font-extrabold mb-4 tracking-tight">
            Vijay <span class="gradient-text">Saharan</span> HQ
        </h1>
        <p class="text-gray-400 text-lg">Tech, Coding, Gaming, and Education Hub</p>
    </header>

    <div class="max-w-6xl mx-auto mb-10 flex flex-col md:flex-row gap-4">
        <div class="relative flex-grow">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
            <input type="text" id="searchInput" onkeyup="renderHub()" placeholder="Search 100+ resources..." 
                   class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 transition-all">
        </div>
        <select id="categoryFilter" onchange="renderHub()" class="bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-gray-400 focus:outline-none focus:border-blue-500">
            <option value="All">All Categories</option>
            <option value="Development">Development</option>
            <option value="Education">Education</option>
            <option value="Platforms">My Platforms</option>
        </select>
    </div>

    <div class="max-w-6xl mx-auto">
        <div id="platform-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </div>

    <script>
        const myWhatsApp = "919876543210"; // REPLACE WITH YOUR NUMBER
        let database = [];

        // Load data from external JSON
        async function init() {
            try {
                const res = await fetch('courses.json');
                database = await res.json();
                renderHub();
            } catch (err) {
                console.error("Data load failed", err);
                document.getElementById('platform-grid').innerHTML = "<p class='text-center col-span-full text-red-400'>Error loading course data.</p>";
            }
        }

        function renderHub() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const container = document.getElementById('platform-grid');
            
            container.innerHTML = "";

            const filtered = database.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(query);
                const matchCat = (category === "All" || item.cat === category);
                return matchSearch && matchCat;
            });

            filtered.forEach(s => {
                const isPaid = s.isPaid === true;
                const badge = isPaid ? `<div class="absolute top-4 right-4 bg-amber-500 text-black text-[10px] font-bold px-2 py-1 rounded">PREMIUM</div>` : '';
                
                const btn = isPaid 
                    ? `<a href="https://wa.me/${myWhatsApp}?text=I want to buy ${s.name}" target="_blank" class="w-full mt-auto py-3 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-xl text-center transition-all">BUY NOW ${s.price}</a>`
                    : `<a href="${s.url}" target="_blank" class="mt-auto text-blue-400 font-bold hover:underline">EXPLORE NOW →</a>`;

                container.innerHTML += `
                    <div class="card-glow p-8 rounded-3xl flex flex-col items-start relative overflow-hidden h-full">
                        ${badge}
                        <i class="fas ${s.icon} text-3xl mb-6 ${isPaid ? 'text-amber-400' : 'text-blue-400'}"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-2">${s.cat}</span>
                        <h3 class="text-xl font-bold mb-4">${s.name}</h3>
                        ${btn}
                    </div>
                `;
            });
        }

        init();
    </script>
</body>
</html>
