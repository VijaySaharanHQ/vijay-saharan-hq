<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise | Vijay Saharan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        body { background: #0f172a; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
        .wish-font { font-family: 'Dancing Script', cursive; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="setup" class="text-center z-10">
        <h2 class="text-white text-xl mb-6 opacity-50 uppercase tracking-widest">A message from Vijay</h2>
        <button onclick="startSurprise()" class="bg-purple-600 hover:bg-purple-500 text-white px-10 py-4 rounded-full font-bold text-lg shadow-lg shadow-purple-500/30 transition-all transform hover:scale-110">
            Click to Open Your Surprise 🎁
        </button>
    </div>

    <div id="mainContent" class="hidden text-center z-10 max-w-lg px-6">
        <div class="glass p-10 rounded-[40px] animate-float">
            <h1 class="wish-font text-6xl md:text-7xl text-purple-400 mb-6">Happy Birthday!</h1>
            <p class="text-gray-300 text-lg leading-relaxed mb-8">
                "Another year older, another year wiser, and still the most amazing person I know. I coded this little space just for you."
            </p>
            <div class="text-5xl">🎂 ✨ 🎈</div>
        </div>
    </div>

    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-10 left-10 w-32 h-32 bg-purple-500/20 blur-[100px] rounded-full"></div>
        <div class="absolute bottom-10 right-10 w-64 h-64 bg-blue-500/10 blur-[120px] rounded-full"></div>
    </div>

    <script>
        function startSurprise() {
            // 1. Hide Button, Show Message
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');

            // 2. Fire Confetti
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
