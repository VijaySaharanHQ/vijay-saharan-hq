<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Vibes | Vijay Saharan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        /* Neon Visualizer Bars */
        .visualizer { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
        .bar { 
            width: 12px; 
            background: #7c3aed; 
            box-shadow: 0 0 15px #7c3aed; 
            border-radius: 10px; 
            animation: bounce 1s ease-in-out infinite; 
            animation-play-state: paused; /* Starts paused */
        }
        
        @keyframes bounce {
            0%, 100% { height: 20%; filter: hue-rotate(0deg); opacity: 0.5; }
            50% { height: 100%; filter: hue-rotate(45deg); opacity: 1; }
        }

        /* Glassmorphism Player */
        .glass-player { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 0 50px rgba(124, 58, 237, 0.1);
        }

        .glow-text { text-shadow: 0 0 10px #7c3aed; }

        /* Custom Range Slider */
        input[type=range] { accent-color: #7c3aed; background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-purple-900/20 blur-[180px] rounded-full -z-10"></div>

    <div class="z-10 text-center w-full max-w-lg">
        <h1 class="text-[10px] tracking-[1.2em] uppercase opacity-40 mb-16 animate-pulse">Neural Audio Interface v2.0</h1>
        
        <div class="visualizer mb-20 justify-center">
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.6s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
            <div class="bar" style="animation-delay: 0.1s"></div>
        </div>

        <div class="glass-player p-10 rounded-[50px] relative">
            <h2 class="text-3xl font-black glow-text mb-1 tracking-tighter">LO-FI FOCUS</h2>
            <p id="statusText" class="text-[9px] text-purple-400 tracking-[0.4em] mb-10 uppercase font-bold">Status: Standby</p>

            <div class="hidden">
                <div id="player"></div>
            </div>

            <div class="flex flex-col gap-8 items-center">
                
                <div class="w-full flex items-center gap-4 px-4">
                    <span class="text-[10px] opacity-50">VOL</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" class="w-full h-1 rounded-lg cursor-pointer">
                </div>

                <div class="flex justify-center gap-10 items-center">
                    <button onclick="controlMusic('pause')" class="text-gray-500 hover:text-white transition-all transform hover:scale-110">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M5.5 3.5A.5.5 0 0 1 6 4v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5zm5 0a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5z"/>
                        </svg>
                    </button>

                    <button id="mainBtn" onclick="controlMusic('play')" class="w-24 h-24 bg-purple-600 rounded-full flex items-center justify-center shadow-[0_0_40px_#7c3aed] hover:scale-105 active:scale-95 transition-all group">
                        <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="white" viewBox="0 0 16 16">
                            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                        </svg>
                    </button>

                    <button onclick="changeTrack()" class="text-gray-500 hover:text-white transition-all transform hover:scale-110">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M12.5 4a.5.5 0 0 0-1 0v3.248L5.233 3.612C4.713 3.31 4 3.655 4 4.308v7.384c0 .653.713.998 1.233.696L11.5 8.752V12a.5.5 0 0 0 1 0V4z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <p class="mt-12 text-[8px] text-gray-700 tracking-widest uppercase">Encryption Active &bull; Vijay Saharan HQ</p>
    </div>

    <script>
        let player;
        let isReady = false;
        const videoIds = ["jfKfPfyJRdk", "L7284Xo8R8Y", "4xDzrJKXOOY"]; // Lofi Girl, Synthwave, Chill
        let currentTrack = 0;

        // 1. Initialize YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: videoIds[currentTrack],
                playerVars: { 'autoplay': 0, 'controls': 0, 'showinfo': 0, 'rel': 0 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isReady = true;
            document.getElementById('statusText').innerText = "Status: Online";
            player.setVolume(document.getElementById('volumeSlider').value);
        }

        function onPlayerStateChange(event) {
            const bars = document.querySelectorAll('.bar');
            if (event.data == YT.PlayerState.PLAYING) {
                document.getElementById('statusText').innerText = "Status: Streaming Audio";
                bars.forEach(bar => bar.style.animationPlayState = 'running');
            } else {
                document.getElementById('statusText').innerText = "Status: Paused";
                bars.forEach(bar => bar.style.animationPlayState = 'paused');
            }
        }

        function controlMusic(action) {
            if (!isReady) return;
            if (action === 'play') {
                player.playVideo();
            } else {
                player.pauseVideo();
            }
        }

        function changeTrack() {
            currentTrack = (currentTrack + 1) % videoIds.length;
            player.loadVideoById(videoIds[currentTrack]);
            controlMusic('play');
        }

        // Volume Listener
        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            if(isReady) player.setVolume(e.target.value);
        });
    </script>
</body>
</html>
